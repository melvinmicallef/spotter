name: Publish container

on:
  workflow_call:
    inputs:
      release_ref:
        description: Validated release tag
        required: true
        type: string
      release_sha:
        description: Commit that passed the validation workflow
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag; defaults to sha-<commit>
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: release
        name: Validate and normalize release metadata
        env:
          RELEASE_EVENT_NAME: ${{ inputs.release_ref != '' && 'push' || github.event_name }}
          RELEASE_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: node scripts/release-metadata.mjs
      - name: Verify tag points to the validated commit
        if: ${{ inputs.release_ref != '' }}
        env:
          RELEASE_REF_NAME: ${{ inputs.release_ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_REF_NAME}^{commit}")"
          if [ "$tag_commit" != "$RELEASE_SHA" ]; then
            echo 'The release tag does not point to the commit that passed Validate.' >&2
            exit 1
          fi
      - id: source
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  validate-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Validate release source
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate browser flows
        run: npm run test:e2e

  publish:
    needs:
      - prepare
      - validate-manual
    if: >-
      ${{ always() && needs.prepare.result == 'success' &&
          (github.event_name != 'workflow_dispatch' ||
           needs.validate-manual.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/melvinmicallef/spotter
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.release_version }},enable=${{ needs.prepare.outputs.release_version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.release_version }},enable=${{ needs.prepare.outputs.release_version != '' && needs.prepare.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.release_version != '' && needs.prepare.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ needs.prepare.outputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.app_version }}
            GIT_COMMIT=${{ needs.prepare.outputs.release_sha }}

name: Validate

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag spotter:validation .

  publish:
    name: Publish validated release image
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
